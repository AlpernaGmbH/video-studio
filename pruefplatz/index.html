<title>Alperna Prüfplatz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap">
<style>
/* Übersicht statt Sammelstelle (Auftrag vom 18.10.2026): links die Seitenleiste mit drei Bereichen (Heute, Plattformen, Werkstatt),
   rechts die Seite, Details und Aktionen in einem Seitenfenster. Design wie alperna-tool: Papier, Tinte, Orange, Sonne.
   Orange nur für Hover und den aktiven Punkt, Sonne nur für «wartet auf dich». Pro Seitenfenster genau eine Hauptaktion. */
:root {
  color-scheme: light dark;
  --papier: #f3f1ec;
  --papier-2: #e9e6df;
  --karte: #fffdf8;
  --tinte: #0f0f0e;
  --gedaempft: #65645f;
  --linie: rgb(15 15 14 / 14%);
  --linie-stark: rgb(15 15 14 / 30%);
  --brand: #f0532f;
  --brand-text: #c23a17;
  --sonne: #ffc93c;
  --ok: #2f7d4f;
  --stopp: #c23a17;
  --bg: var(--papier);
  --fg: var(--tinte);
  --primaer: #0f0f0e;
  --primaer-text: #f3f1ec;
  --schleier: rgb(15 15 14 / 45%);
  --seite-bg: #0f0f0e;
  --seite-fg: #f3f1ec;
  --seite-mut: #a19f99;
  --seite-akzent: #1c1c1a;
  --seite-linie: rgb(243 241 236 / 14%);
  --radius: 12px;
  --f-text: "Geist", "Helvetica Neue", Arial, sans-serif;
  --f-serif: "Instrument Serif", Georgia, "Times New Roman", serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0f0e; --fg: #f3f1ec; --karte: #1a1a18; --papier-2: #26261f; --gedaempft: #a19f99;
    --linie: rgb(243 241 236 / 14%); --linie-stark: rgb(243 241 236 / 32%);
    --brand-text: #f0532f; --ok: #7fd3a0; --stopp: #f0532f;
    --primaer: #f3f1ec; --primaer-text: #0f0f0e; --schleier: rgb(0 0 0 / 60%);
    --seite-bg: #0a0a09;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0f0e; --fg: #f3f1ec; --karte: #1a1a18; --papier-2: #26261f; --gedaempft: #a19f99;
  --linie: rgb(243 241 236 / 14%); --linie-stark: rgb(243 241 236 / 32%);
  --brand-text: #f0532f; --ok: #7fd3a0; --stopp: #f0532f;
  --primaer: #f3f1ec; --primaer-text: #0f0f0e; --schleier: rgb(0 0 0 / 60%);
  --seite-bg: #0a0a09;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0; color: var(--fg); font-family: var(--f-text); font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%;
  overflow-x: clip;
}
h1, h2, h3 { font-family: var(--f-text); font-weight: 500; letter-spacing: -0.01em; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 em, h2 em, h3 em { font-family: var(--f-serif); font-style: italic; font-weight: 400; letter-spacing: 0; }
p { margin: 0; max-width: 68ch; }
::selection { background: var(--brand); color: var(--tinte); }
a { color: var(--fg); text-underline-offset: 3px; text-decoration-color: var(--linie-stark); }
a:hover { color: var(--brand-text); text-decoration-color: var(--brand); }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.eyebrow { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gedaempft); font-weight: 500; }
.muted, .hinweis { color: var(--gedaempft); }
.hinweis { font-size: 14px; }
.mono, .zahl { font-family: var(--f-mono); }

/* Gerüst */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.seite { background: var(--seite-bg); color: var(--seite-fg); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; padding: 22px 14px 18px; }
.wortmarke { display: flex; align-items: baseline; gap: 8px; padding: 0 10px; }
.wortmarke b { font-weight: 600; font-size: 20px; letter-spacing: -0.02em; text-transform: lowercase; }
.wortmarke span { font-size: 13px; color: var(--seite-mut); }
.nav-gruppe { display: grid; gap: 2px; }
.nav-titel { margin: 12px 10px 4px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--seite-mut); font-weight: 500; }
.nav {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left;
  font: inherit; font-weight: 500; font-size: 15px; color: var(--seite-fg); background: none; cursor: pointer;
  border: 0; border-left: 3px solid transparent; border-radius: 0 10px 10px 0; padding: 9px 12px 9px 10px;
}
.nav:hover { color: var(--brand); }
.nav[aria-current="page"] { background: var(--seite-akzent); border-left-color: var(--brand); }
.nav .zahl { font-size: 12px; min-width: 22px; text-align: center; padding: 1px 7px; border-radius: 999px; background: var(--seite-akzent); color: var(--seite-fg); }
.nav[aria-current="page"] .zahl { background: var(--seite-bg); }
.nav .zahl[data-null="true"] { background: transparent; color: var(--seite-mut); }
.nav .zahl[data-wartet="true"] { background: var(--sonne); color: var(--tinte); }
.seite-fuss { margin-top: auto; display: grid; gap: 12px; padding: 14px 10px 0; border-top: 1px solid var(--seite-linie); }
.seite-fuss .feld label { color: var(--seite-mut); }
.seite-fuss input[type="text"] { background: var(--seite-akzent); color: var(--seite-fg); border-color: var(--seite-linie); }
.seite-fuss .knopf { color: var(--seite-fg); border-color: var(--seite-linie); }
.seite-fuss .knopf:hover { color: var(--brand); border-color: var(--brand); background: transparent; }
.seite-fuss .fuss { font-size: 12px; color: var(--seite-mut); max-width: none; }
.haupt { padding: 40px clamp(16px, 4vw, 52px) 80px; width: 100%; max-width: 1080px; display: grid; gap: 28px; align-content: start; min-width: 0; }
.kopf { display: grid; gap: 8px; }
.kopf h1 { font-size: clamp(30px, 4.2vw, 44px); }
.kopf p { color: var(--gedaempft); }
.ansicht { display: grid; gap: 20px; align-content: start; min-width: 0; }

/* Formularfelder und Knöpfe */
.feld { display: grid; gap: 5px; }
.feld label { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gedaempft); font-weight: 500; }
input[type="text"], textarea, select {
  font: inherit; color: var(--fg); background: var(--karte); border: 1px solid var(--linie-stark);
  border-radius: 10px; padding: 9px 12px; min-width: 0; width: 100%;
}
textarea { resize: vertical; min-height: 88px; }
input::placeholder, textarea::placeholder { color: var(--gedaempft); opacity: 0.75; }
.knopf {
  font: inherit; font-weight: 500; font-size: 15px; line-height: 1; cursor: pointer; border-radius: 999px; padding: 12px 20px;
  border: 1px solid var(--linie-stark); background: transparent; color: var(--fg); transition: background-color 0.15s ease-out, color 0.15s ease-out, border-color 0.15s ease-out;
}
.knopf:hover { border-color: var(--brand); color: var(--brand-text); }
.knopf:active { opacity: 0.85; }
.knopf[disabled] { opacity: 0.45; cursor: not-allowed; }
.knopf.primaer { background: var(--primaer); border-color: var(--primaer); color: var(--primaer-text); }
.knopf.primaer:hover { background: var(--brand); border-color: var(--brand); color: var(--tinte); }
.knopf.klein { padding: 8px 14px; font-size: 14px; }
.aktionen { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Karten, Reihen, Chips */
.karte { background: var(--karte); border: 1px solid var(--linie); border-radius: var(--radius); }
.heute-karte { padding: 18px 20px; display: grid; gap: 12px; }
.heute-karte h3 { font-size: 20px; }
.heute-karte .zeile, .kopfzeile { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.meta { color: var(--gedaempft); font-size: 14px; overflow-wrap: anywhere; }
.kurz { color: var(--gedaempft); overflow-wrap: anywhere; }
.chip { display: inline-block; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--linie-stark); color: var(--fg); white-space: nowrap; }
.chip.still { color: var(--gedaempft); border-color: var(--linie); }
.chip.ok { color: var(--ok); border-color: currentColor; }
.chip.stopp { color: var(--stopp); border-color: currentColor; }
.chip.wartet { background: var(--sonne); border-color: var(--sonne); color: var(--tinte); }
.leer { padding: 26px 22px; display: grid; gap: 6px; }
.leer h3 { font-size: 20px; }
.gruppe { display: grid; gap: 8px; }
.gruppe-kopf { display: flex; align-items: baseline; gap: 10px; }
.gruppe-kopf h2 { font-size: 18px; }
.gruppe-kopf .zahl { font-size: 13px; color: var(--gedaempft); }
.liste { display: grid; }
.reihe {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 16px; align-items: center; width: 100%; text-align: left;
  font: inherit; color: inherit; background: none; border: 0; border-top: 1px solid var(--linie); padding: 14px 20px; cursor: pointer;
}
.reihe:first-child { border-top: 0; border-radius: var(--radius) var(--radius) 0 0; }
.reihe:last-child { border-radius: 0 0 var(--radius) var(--radius); }
.reihe:only-child { border-radius: var(--radius); }
.reihe:hover { background: var(--papier-2); }
.reihe .titel { font-weight: 500; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.reihe .meta { grid-column: 1; }
.reihe .kurz { grid-column: 1 / -1; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.reihe .chip { grid-column: 2; grid-row: 1; }
.ausgeblendet { font-size: 14px; color: var(--gedaempft); }
.pausierte { display: grid; gap: 10px; justify-items: start; margin-top: 8px; }
.pausierte .liste { justify-self: stretch; }
.warnung { border: 1px solid var(--stopp); border-radius: 10px; padding: 10px 14px; color: var(--stopp); font-size: 14px; }
.meldung { border: 1px solid var(--linie-stark); border-radius: 10px; padding: 12px 14px; background: var(--karte); display: grid; gap: 8px; }
.meldung.fehler { border-color: var(--stopp); }
.meldung.gut { border-color: var(--ok); }
.meldung strong { font-weight: 600; }
#status:empty { display: none; }

/* Werkstatt */
.kacheln { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.kachel { display: grid; gap: 6px; text-align: left; font: inherit; color: inherit; background: var(--karte); border: 1px solid var(--linie); border-radius: var(--radius); padding: 18px 20px; cursor: pointer; }
.kachel:hover { border-color: var(--brand); }
.kachel[aria-expanded="true"] { border-color: var(--fg); }
.kachel .gross { font-family: var(--f-mono); font-size: 32px; line-height: 1.1; }
.kachel .titel { font-weight: 500; font-size: 17px; }
.kachel .gross.text { font-family: var(--f-text); font-weight: 500; font-size: 26px; letter-spacing: -0.01em; }
.raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.stueck { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; padding: 18px; align-items: start; }
.stueck img { width: 120px; aspect-ratio: 9 / 16; object-fit: contain; background: var(--papier-2); border-radius: 10px; }
.stueck h3 { font-size: 20px; }
.stueck ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; font-size: 14px; }
.stueck .inhalt { display: grid; gap: 10px; min-width: 0; }
.farben { display: flex; flex-wrap: wrap; gap: 12px; }
.farbe { display: grid; gap: 6px; width: 120px; }
.farbe i { display: block; height: 56px; border-radius: 10px; border: 1px solid var(--linie-stark); }
.farbe code { font-family: var(--f-mono); font-size: 13px; color: var(--gedaempft); }
dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 18px; }
dt { color: var(--gedaempft); font-size: 14px; }
dd { margin: 0; overflow-wrap: anywhere; }
.padding { padding: 20px; display: grid; gap: 14px; }

/* Seitenfenster */
.huelle { position: fixed; inset: 0; z-index: 50; background: var(--schleier); display: flex; justify-content: flex-end; }
.huelle[hidden] { display: none; }
.detail { background: var(--karte); color: var(--fg); width: min(600px, 100%); height: 100%; overflow-y: auto; border-left: 1px solid var(--linie); display: flex; flex-direction: column; overscroll-behavior: contain; }
.detail-kopf { position: sticky; top: 0; z-index: 2; background: var(--karte); padding: 18px 22px 14px; border-bottom: 1px solid var(--linie); display: grid; gap: 10px; }
.detail-kopf .zeile { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.detail-kopf h2 { font-size: 24px; overflow-wrap: anywhere; }
.detail-inhalt { padding: 20px 22px 24px; display: grid; gap: 22px; align-content: start; }
#detail-inhalt { display: grid; gap: 22px; align-content: start; }
#detail-status-platz:empty, #detail-status-platz:has(#status:empty) { display: none; }
/* Die Hauptaktion bleibt am unteren Rand des Fensters sichtbar, auch wenn der Inhalt lang ist. */
.aktionen.haupt { position: sticky; bottom: 0; z-index: 1; background: var(--karte); padding: 12px 0 max(14px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--linie); }
.abschnitt { display: grid; gap: 8px; }
.zitat { font-size: 21px; line-height: 1.3; font-weight: 500; overflow-wrap: anywhere; }
.text { white-space: pre-line; overflow-wrap: anywhere; }
.entwurf { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--linie); border-radius: 10px; padding: 14px 16px; max-height: 420px; overflow: auto; }
.fortschritt { height: 4px; border-radius: 999px; background: var(--linie); overflow: hidden; }
.fortschritt > i { display: block; height: 100%; background: var(--fg); transition: width 0.2s; }
.durchgang-leiste { display: grid; gap: 8px; }
.durchgang-leiste .zeile { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.material-liste { display: grid; gap: 0; border: 1px solid var(--linie); border-radius: 10px; }
.material-eintrag { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--linie); }
.material-eintrag:first-child { border-top: 0; }
.material-eintrag .ziel { overflow-wrap: anywhere; font-size: 14px; }
.material-eintrag .notiz { grid-column: 2; color: var(--gedaempft); font-size: 13px; }
.material-form { display: grid; gap: 10px; grid-template-columns: 140px minmax(0, 1fr); align-items: end; }
.material-form .breit { grid-column: 1 / -1; }
.fehlertext { color: var(--stopp); font-size: 14px; }

/* Looks */
.looks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.look { position: relative; display: grid; gap: 8px; align-content: start; border: 1px solid var(--linie); border-radius: var(--radius); padding: 10px; background: var(--bg); cursor: pointer; min-width: 0; }
.look input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.look:has(input:checked) { outline: 2px solid var(--fg); outline-offset: 2px; }
.look:has(input:focus-visible) { outline: 2px solid var(--brand); outline-offset: 4px; }
.look img { width: 100%; aspect-ratio: 9 / 16; max-height: 320px; object-fit: contain; background: var(--papier-2); border-radius: 8px; display: block; }
.look .kein-bild { aspect-ratio: 9 / 16; max-height: 320px; display: grid; place-items: center; background: var(--papier-2); border-radius: 8px; color: var(--gedaempft); font-size: 14px; padding: 12px; text-align: center; }
.look b { font-weight: 600; }
.look span { font-size: 14px; color: var(--gedaempft); overflow-wrap: anywhere; }
.keiner { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border: 1px solid var(--linie); border-radius: var(--radius); cursor: pointer; }
.keiner:has(input:checked) { outline: 2px solid var(--fg); outline-offset: 2px; }
.renders { display: flex; flex-wrap: wrap; gap: 12px; }
.renders figure { margin: 0; display: grid; gap: 6px; width: 160px; max-width: 100%; }
.renders img { width: 100%; aspect-ratio: 9 / 16; object-fit: contain; background: var(--papier-2); border-radius: 8px; }
.renders figcaption { font-size: 13px; color: var(--gedaempft); }

@media (max-width: 859px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .seite { position: static; height: auto; overflow: visible; padding-block: 14px; gap: 12px; }
  .seite, .haupt {
    padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
    padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
  }
  .seite { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px 12px; }
  .wortmarke { grid-column: 1; grid-row: 1; padding: 0; }
  #nav { grid-column: 1 / -1; grid-row: 2; display: flex; flex-wrap: wrap; gap: 6px; }
  .nav-gruppe { display: contents; }
  .nav-titel { display: none; }
  .seite-fuss { display: contents; }
  #neu-laden { grid-column: 2; grid-row: 1; }
  .seite-fuss .feld { grid-column: 1 / -1; grid-row: 3; display: flex; align-items: center; gap: 10px; }
  .seite-fuss .feld label { white-space: nowrap; }
  .seite-fuss .fuss { display: none; }
  .nav { width: auto; min-height: 44px; border: 1px solid var(--seite-linie); border-radius: 999px; padding: 8px 14px; }
  .nav[aria-current="page"] { border-color: var(--brand); }
  .haupt { padding-top: 26px; }
  .knopf { padding: 14px 20px; min-height: 44px; }
  .knopf.klein { min-height: 44px; }
  .reihe { padding: 14px 16px; min-height: 44px; }
  .detail { width: 100%; border-left: 0; }
  .stueck { grid-template-columns: 1fr; }
  .material-form { grid-template-columns: 1fr; }
  input[type="text"], select { min-height: 44px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

        <p class="nav-titel">Plattformen</p>

        <button class="nav" type="button" id="n-linkedin" data-ansicht="linkedin">LinkedIn <span class="zahl" id="z-linkedin" data-null="true">0</span></button>

      <div id="detail-status-platz"></div>
      <div id="detail-inhalt"></div>
    </div>
  </aside>
</div>

<script>

  /** Alles, worauf ein Mensch wartet: Gate 0, Tor I, Tor P, Pitch, Look, Abnahme. Das ist die Seite «Heute». */

  /** Gate 0 einer Marke: Lücken des Profils, Bestätigung mit Namen. Die Freigabe gibt ein Mensch, hier. */

    const stills = m.bilder.filter((b) => b.bild).map((b) => h("figure", null, h("img", { src: b.ziel, alt: "Standbild " + b.id, loading: "lazy" }), h("figcaption", { text: b.text || b.id })));
    return [
      abschnitt("Das gebaute Stück", h("p", { text: m.stueck ? "«" + m.stueck + "». Claude hat das Render selbst geprüft: Länge, Transparenz, Ränder, erstes und letztes Bild." : "Claude hat das Render selbst geprüft." })),
      stills.length ? abschnitt("Standbilder aus dem Render", h("div", { class: "renders" }, stills)) : h("p", { class: "hinweis", text: "Zu dieser Abnahme gibt es keine Standbilder im Prüfplatz. Das Render liegt auf OneDrive." }),
      abschnitt("Der Satz, der es ausgelöst hat", h("p", { class: "zitat", text: "«" + m.satz + "»" })),
      textfeld(m, "notiz", "Notiz (bei «Änderung nötig» Pflicht)", "Was soll anders sein? Konkret, zum Beispiel: Zahl 10 Prozent kleiner, Linie dünner."),
      h("p", { class: "hinweis" }, "Mit der Abnahme kommt das Stück in die Bibliothek und darf in Storyboards verwendet werden. ", notionLink(m)),
      h("div", { class: "aktionen" },
        knopf(m, "Abnehmen", "primaer", () => true, () => senden(m, Object.assign({ Abnahme: "abgenommen", "Abnahme-Notiz": notiz() || null, "Abnahme von": S.name.trim() }, datum("Abnahme am")), nochOffen, (d) => d.abnahme === "abgenommen")),
        knopf(m, "Änderung nötig", "", () => notiz().length >= 5, () => senden(m, Object.assign({ Abnahme: "aenderung", "Abnahme-Notiz": notiz(), "Abnahme von": S.name.trim() }, datum("Abnahme am")), nochOffen, (d) => d.abnahme === "aenderung"))),
    ];
  }

  function torIInhalt(c, mk, g0) {
    const modus = S.torModus[c.id] || false; // false, "ablehnen" oder "rueckfrage"
    const text = () => entwurfFeld(c, "text", "").trim();
    const grundOk = () => text().length >= 10 && woerter(text()) >= 2;
    const frageOk = () => text().length >= 5;
    const nochOffen = (f) => f.status === "Pitch bereit" && torOffen(f.torI);
    const sende = (e, grund) => senden(c, Object.assign({ "Tor I Entscheid": e, "Tor I Grund": grund || null, "Tor I von": S.name.trim() }, datum("Tor I am")), nochOffen, (d) => d.torI.entscheid === e);
    const waehle = (m) => { setzeEntwurf(c, "text", ""); S.torModus[c.id] = m; if (m) S.fokus = "textarea"; zeichne(); };
    const link = /^https?:\/\//.test(c.referenz) ? h("a", { href: c.referenz, target: "_blank", rel: "noopener", text: "Quelle öffnen" }) : null;
    return [
      g0 !== "freigegeben" ? h("p", { class: "warnung", text: mk ? "Gate 0 der Marke «" + mk.titel + "» ist noch nicht freigegeben. Dein Entscheid wird gespeichert, wirkt aber erst, wenn Gate 0 freigegeben ist." : "Diesem Inhalt ist keine Marke zugeordnet. Ohne Marke geht er nicht in Produktion." }) : null,
      abschnitt("Der erste Satz", h("p", { class: "zitat", text: "«" + c.hook + "»" })),
      abschnitt("Was ist neu oder anders", h("p", { class: "text", text: c.winkel })),
      abschnitt("Beleg", h("p", { class: "text", text: c.beleg }), link),
      abschnitt("Eckdaten", zeilenListe([["Format", c.format], ["Plattformen", c.plattformen.join(", ")], ["Person", c.profil], ["Marke", mk ? mk.titel : ""], ["Quelle", c.quelle], ["Aufwand", c.aufwand]])),
      modus === "ablehnen" ? textfeld(c, "text", "Grund der Ablehnung", "Mindestens zwei Wörter. Der Grund verhindert, dass dieselbe Idee wiederkommt.") : null,
      modus === "rueckfrage" ? textfeld(c, "text", "Deine Frage an Claude", "Claude beantwortet sie und legt die Idee neu vor.") : null,
      h("p", { class: "hinweis" }, "Nach einer Freigabe entsteht der Inhalt. Zuerst prüft Claude Beleg und Dubletten. ", notionLink(c)),
      h("div", { class: "aktionen" },
        modus === "ablehnen" ? [knopf(c, "Ablehnung senden", "primaer", grundOk, () => sende("abgelehnt", text())), knopf(c, "Zurück", "", () => true, () => waehle(false))]
        : modus === "rueckfrage" ? [knopf(c, "Frage senden", "primaer", frageOk, () => sende("Rückfrage", text())), knopf(c, "Zurück", "", () => true, () => waehle(false))]
        : [knopf(c, "Freigeben", "primaer", () => true, () => sende("freigegeben", "")), knopf(c, "Mit Frage zurück", "", () => true, () => waehle("rueckfrage")), knopf(c, "Ablehnen", "", () => true, () => waehle("ablehnen"))]),
    ];
  }

  /** Der Text eines Entwurfs steht im Inhalt der Notion-Seite. Er wird beim Öffnen geladen. */
  function seitentext(c) {
    const vorhanden = S.seitentext[c.id];
    if (vorhanden) return vorhanden;
    S.seitentext[c.id] = { status: "laden" };
    (async () => {
      try {
        const pg = await aufruf("notion-fetch", { id: c.seite });
        const roh = pg && typeof pg.text === "string" ? pg.text : "";
        const m = roh.match(/<content>([\s\S]*?)<\/content>/);
        S.seitentext[c.id] = { status: "fertig", text: (m ? m[1] : "").trim() };
      } catch (e) {
        S.seitentext[c.id] = { status: "fehler", meldung: fehlertext(e, false)[1] };
      }
      zeichne();
    })();
    return S.seitentext[c.id];
  }

  function torPInhalt(c, mk, g0) {
    const modus = S.torModus[c.id] || false; // false oder "aenderung"
    const text = () => entwurfFeld(c, "text", "").trim();
    const nochOffen = (f) => f.status === "Entwurf fertig" && torOffen(f.torP);
    const sende = (e, grund) => senden(c, Object.assign({ "Tor P Entscheid": e, "Tor P Grund": grund || null, "Tor P von": S.name.trim() }, datum("Tor P am")), nochOffen, (d) => d.torP.entscheid === e);
    const waehle = (m) => { setzeEntwurf(c, "text", ""); S.torModus[c.id] = m; if (m) S.fokus = "textarea"; zeichne(); };
    const st = seitentext(c);
    const entwurf = st.status === "fertig"
      ? (st.text ? h("div", { class: "entwurf", text: st.text }) : h("p", { class: "hinweis", text: "Die Notion-Seite hat noch keinen Text. Bei Reels und Carousels liegt der Entwurf als Datei vor (siehe unten)." }))
      : st.status === "fehler" ? h("p", { class: "warnung", text: "Der Entwurf liess sich nicht laden: " + st.meldung })
      : h("p", { class: "hinweis", text: "Lade den Entwurf aus Notion …" });
    return [
      g0 !== "freigegeben" ? h("p", { class: "warnung", text: mk ? "Gate 0 der Marke «" + mk.titel + "» ist noch nicht freigegeben. Deine Freigabe wirkt erst danach." : "Diesem Inhalt ist keine Marke zugeordnet." }) : null,
      c.offeneMarkierungen > 0 ? h("p", { class: "warnung", text: c.offeneMarkierungen + " offene Markierung(en) der Schwere «muss». Deine Freigabe wirkt erst, wenn sie erledigt sind." }) : null,
      abschnitt("Der Entwurf", entwurf),
      c.ziel ? abschnitt("Ziel", h("p", { class: "text", text: c.ziel })) : null,
      abschnitt("Beleg: Jede Zahl im Text muss hier stehen", h("p", { class: "text", text: c.beleg })),
      modus === "aenderung" ? textfeld(c, "text", "Was soll anders sein", "Konkret, zum Beispiel: Schluss kürzer, Zahl im zweiten Satz streichen.") : null,
      h("p", { class: "hinweis" }, "Mit der Freigabe darf der Inhalt geplant werden. ", notionLink(c)),
      h("div", { class: "aktionen" },
        modus === "aenderung" ? [knopf(c, "Änderung senden", "primaer", () => text().length >= 5, () => sende("Änderung", text())), knopf(c, "Zurück", "", () => true, () => waehle(false))]
        : [knopf(c, "Freigeben", "primaer", () => true, () => sende("freigegeben", "")), knopf(c, "Änderung nötig", "", () => true, () => waehle("aenderung"))]),
    ];
  }

  /* ---------- Pausieren, Verwerfen, «Veröffentlicht» bestätigen ---------- */
  const NICHT_PAUSIERBAR = ["Verworfen", "Ausgewertet", "Veröffentlicht", "Pausiert"];
  const NICHT_VERWERFBAR = ["Verworfen", "Ausgewertet", "Veröffentlicht", "Pitch bereit"]; // «Pitch bereit» entscheidet Tor I
  const verwaltenAktionen = (c) => ({
    pausieren: !NICHT_PAUSIERBAR.includes(stand(c)),
    verwerfen: !NICHT_VERWERFBAR.includes(stand(c)),
    bestaetigen: c.status === "Geplant" && ["Manuell", "Paket"].includes(c.publishing),
    fortsetzen: stand(c) === "Pausiert",
  });

  /** Im Seitenfenster: «Veröffentlicht bestätigen» als Hauptaktion bei geplanten Beiträgen, Pausieren und Verwerfen hinter einem Knopf. */
  function verwaltenBlock(c) {
    const a = verwaltenAktionen(c);
    if (!a.pausieren && !a.verwerfen && !a.bestaetigen && !a.fortsetzen) return null;
    const offen = S.verwalten === c.id;
    const grund = () => entwurfFeld(c, "grund", "").trim();
    const kurz = () => grund().length >= 5;
    const lang = () => grund().length >= 10 && woerter(grund()) >= 2;
    const st = stand(c);
    // Beim Pausieren merkt sich die Zeile den bisherigen Status, damit das Fortsetzen dorthin zurückführt. Wer aus der Pause verwirft, leert das Feld.
    const pause = (neu) => (neu === "Pausiert" ? { "Status vor Pause": st } : st === "Pausiert" ? { "Status vor Pause": null } : {});
    const sende = (neu, g) => senden(c, Object.assign({ Status: neu, "Status von": S.name.trim(), "Status-Grund": g || null }, pause(neu), datum("Status am")), (f) => stand(f) === st,
      (d) => d.status === neu && d.statusVon === S.name.trim() && (neu !== "Pausiert" || d.statusVorPause === st));
    const ziel = c.statusVorPause;
    const fortsetzen = () => senden(c, Object.assign({ Status: ziel, "Status von": S.name.trim(), "Status-Grund": "Fortgesetzt nach der Pause", "Status vor Pause": null }, datum("Status am")),
      (f) => stand(f) === "Pausiert" && f.statusVorPause === ziel, (d) => d.status === ziel && d.statusVon === S.name.trim());
    return abschnitt(a.fortsetzen ? "Pausiert" : "Weitere Handlungen",
      a.fortsetzen ? h("p", { class: "hinweis", text: "Pausiert" + (c.statusVon ? " von " + c.statusVon : "") + (c.statusGrund ? ": " + c.statusGrund : "") + "." }) : null,
      a.fortsetzen && ziel ? [h("p", { text: "Fortsetzen führt zurück zu «" + ziel + "»." }), h("div", { class: "aktionen" }, knopf(c, "Fortsetzen", "primaer", () => true, fortsetzen))] : null,
      a.fortsetzen && !ziel ? h("p", { class: "warnung", id: "ohne-vorstatus", text: "Der Status vor der Pause ist nicht gespeichert. Sag Claude im Chat, wohin der Inhalt zurück soll." }) : null,
      a.bestaetigen ? h("p", { class: "hinweis", text: "Geplant" + (c.geplantFuer ? " für " + new Date(c.geplantFuer).toLocaleDateString("de-CH") : "") + (c.publishing ? ", Veröffentlichung: " + c.publishing : "") + ". Bestätige erst, wenn der Beitrag wirklich draussen ist." }) : null,
      a.bestaetigen ? h("div", { class: "aktionen" }, knopf(c, "Veröffentlicht bestätigen", "primaer", () => true, () => sende("Veröffentlicht", ""))) : null,
      a.pausieren || a.verwerfen
        ? h("div", { class: "aktionen" }, h("button", { class: "knopf klein", type: "button", id: "verwalten-" + c.id, "aria-expanded": String(offen), onclick: () => { S.verwalten = offen ? null : c.id; if (!offen) S.fokus = "textarea"; zeichne(); } }, (a.pausieren ? "Pausieren oder verwerfen" : "Verwerfen") + (offen ? " schliessen" : "")))
        : null,
      offen && (a.pausieren || a.verwerfen) ? [
        textfeld(c, "grund", "Grund", a.verwerfen ? "Pausieren: ein kurzer Grund. Verwerfen: mindestens zwei Wörter, der Grund verhindert, dass dieselbe Idee wiederkommt." : "Ein kurzer Grund, warum es pausiert."),
        c.status === "Pitch bereit" ? h("p", { class: "hinweis", text: "Ablehnen oder Freigeben entscheidest du mit Tor I." }) : null,
        h("div", { class: "aktionen" },
          a.pausieren ? knopf(c, "Pausieren", "", kurz, () => sende("Pausiert", grund())) : null,
          a.verwerfen ? knopf(c, "Verwerfen", "", lang, () => sende("Verworfen", grund())) : null),
        h("p", { class: "hinweis", text: "Claude übernimmt den Wechsel beim nächsten Abgleich und prüft ihn dabei." }),
      ] : null);
  }

  /* ---------- Start ---------- */
  document.querySelectorAll(".nav").forEach((b) => b.addEventListener("click", () => { S.ansicht = b.dataset.ansicht; S.detail = null; S.durchgang = null; zeichne(); window.scrollTo(0, 0); }));
  $("neu-laden").addEventListener("click", () => { S.meldung = null; S.seitentext = {}; laden(); });
  $("name").addEventListener("input", (ev) => { S.name = ev.target.value; speicher.schreibe("pp-name", S.name); document.querySelectorAll("[data-braucht]").forEach((b) => (b.disabled = S.busy || !b._ok())); });
  $("huelle").addEventListener("click", (ev) => { if (ev.target === $("huelle")) schliesse(); });
  document.addEventListener("keydown", (ev) => {
    if (!S.detail) return;
    if (ev.key === "Escape") { ev.preventDefault(); return schliesse(); }
    if (ev.key !== "Tab") return;
    // Der Fokus bleibt im Seitenfenster: Vom letzten Element geht es zum ersten, vom ersten rückwärts zum letzten.
    const fokussierbar = [...$("detail").querySelectorAll('a[href], button, input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter((e) => !e.disabled && e.type !== "hidden" && e.getClientRects().length);
    if (!fokussierbar.length) return;
    const erstes = fokussierbar[0], letztes = fokussierbar[fokussierbar.length - 1], aktiv = document.activeElement;
    if (!$("detail").contains(aktiv)) { ev.preventDefault(); erstes.focus(); }
    else if (ev.shiftKey && aktiv === erstes) { ev.preventDefault(); letztes.focus(); }
    else if (!ev.shiftKey && aktiv === letztes) { ev.preventDefault(); erstes.focus(); }
  });
  document.addEventListener("visibilitychange", () => {
    const tippt = document.activeElement && /^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement.tagName);
    if (!document.hidden && S.mcp && !S.busy && !tippt && S.laden !== "laden") laden(true);
  });

  S.name = speicher.lies("pp-name");
  zeichne();

  (async () => {
    const claude = window.claude;
    if (!claude || typeof claude.use !== "function") return zeichne();
    const [mcp, user] = await Promise.all([claude.use("mcp").catch(() => null), claude.use("user").catch(() => null)]);
    S.mcp = mcp;
    if (user) {
      try {
        const me = await user.me();
        if (me && me.name && !S.name) { S.name = me.name; speicher.schreibe("pp-name", S.name); }
      } catch { /* Name bleibt leer, der Mensch trägt ihn ein */ }
    }
    zeichne();
    if (S.mcp) laden();
  })();
})();
</script>
