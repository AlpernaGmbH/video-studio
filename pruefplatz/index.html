<title>Alperna Prüfplatz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Poppins:wght@600;700&display=swap">
<style>
/* Layout: eine ruhige Spalte. Oben Tabs, darunter Karten, die sich einzeln öffnen. Pro Karte genau eine Gold-Aktion.
   Dunkel ohne Umschalter: Das Design System v2 (17.9.) ist dunkel, Gold ist der einzige Akzent und nie eine Fläche ausser dem einen Knopf. */
:root {
  --mitternacht: #0a0c10;
  --tiefblau: #111a28;
  --bergblau: #1b2740;
  --alpenblau: #26324a;
  --hoehenblau: #2b3a5a;
  --off: #fdfbfb;
  --off-muted: rgba(253, 251, 251, 0.7);
  --linie: rgba(253, 251, 251, 0.16);
  --linie-stark: rgba(253, 251, 251, 0.34);
  --gold: #ffd700;
  --ink: #121110;
  --ok: #9ad9b8;
  --stopp: #f0a3a3;
  --f-titel: "Poppins", "Helvetica Neue", Arial, sans-serif;
  --f-text: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  --radius: 15px;
  --gutter: 16px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--tiefblau); }
body {
  margin: 0;
  color: var(--off);
  font-family: var(--f-text);
  font-size: 16px;
  line-height: 1.55;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 28px; }
h1, h2, h3 { font-family: var(--f-titel); font-weight: 700; line-height: 1.12; margin: 0; text-wrap: balance; }
p { margin: 0; max-width: 68ch; }
.eyebrow { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--off-muted); font-weight: 500; }
.muted { color: var(--off-muted); }
a { color: var(--off); text-underline-offset: 3px; text-decoration-color: var(--linie-stark); }
a:hover { text-decoration-color: var(--gold); }
:focus-visible { outline: 2px solid var(--off); outline-offset: 3px; border-radius: 6px; }

/* Kopf */
.kopf { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: end; justify-content: space-between; }
.marke { display: grid; gap: 4px; min-width: 0; }
.marke h1 { font-size: 30px; }
.werkzeug { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.feld { display: grid; gap: 4px; }
.feld label { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--off-muted); }
input[type="text"], textarea, select {
  font: inherit; color: var(--off); background: var(--bergblau); border: 0.5px solid var(--linie-stark);
  border-radius: 10px; padding: 9px 12px; min-width: 0; width: 100%;
}
textarea { resize: vertical; min-height: 88px; }
input::placeholder, textarea::placeholder { color: rgba(253, 251, 251, 0.45); }
#name { width: 200px; max-width: 100%; }

/* Knöpfe */
.knopf {
  font-family: var(--f-titel); font-weight: 600; font-size: 15px; line-height: 1; cursor: pointer;
  border-radius: 999px; padding: 13px 22px; border: 0.5px solid var(--linie-stark); background: transparent; color: var(--off);
  transition: background-color 0.2s ease-out, opacity 0.2s ease-out;
}
.knopf:hover { background: rgba(253, 251, 251, 0.08); }
.knopf:active { opacity: 0.8; }
.knopf[disabled] { opacity: 0.45; cursor: not-allowed; }
.knopf.gold { background: var(--gold); border-color: var(--gold); color: var(--ink); }
.knopf.gold:hover { background: #ffe14d; }
.knopf.klein { padding: 9px 16px; font-size: 14px; }

/* Tabs */
.tabs { display: flex; flex-wrap: wrap; gap: 4px 28px; border-bottom: 0.5px solid var(--linie); }
.tab {
  font-family: var(--f-titel); font-weight: 600; font-size: 16px; background: none; border: 0; color: var(--off-muted);
  padding: 10px 0 12px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -0.5px;
}
.tab[aria-selected="true"] { color: var(--off); border-bottom-color: var(--off); }
.tab .zahl { font-family: var(--f-text); font-weight: 500; font-size: 13px; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--hoehenblau); color: var(--off); }
.tab .zahl[data-null="true"] { background: transparent; border: 0.5px solid var(--linie); color: var(--off-muted); }
.panel[hidden] { display: none !important; }
.panel { display: grid; gap: 16px; align-content: start; }

/* Karten */
.karte { background: var(--alpenblau); border: 0.5px solid var(--linie); border-radius: var(--radius); }
.karte-kopf {
  display: grid; gap: 6px; width: 100%; text-align: left; background: none; border: 0; color: inherit; font: inherit;
  padding: 18px 20px; cursor: pointer; border-radius: var(--radius);
}
.karte-kopf h3 { font-size: 20px; }
.karte-kopf .zeile { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.satz-kurz { color: var(--off-muted); overflow-wrap: anywhere; }
.karte-inhalt { padding: 4px 20px 22px; display: grid; gap: 22px; border-top: 0.5px solid var(--linie); margin-top: 0; padding-top: 20px; }
.abschnitt { display: grid; gap: 8px; }
.zitat { font-family: var(--f-titel); font-weight: 600; font-size: 21px; line-height: 1.3; overflow-wrap: anywhere; }
.text { white-space: pre-line; overflow-wrap: anywhere; }
.aktionen { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.hinweis { font-size: 14px; color: var(--off-muted); }
.chip { display: inline-block; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; padding: 3px 10px; border-radius: 999px; border: 0.5px solid var(--linie-stark); color: var(--off); white-space: nowrap; }
.chip.still { color: var(--off-muted); border-color: var(--linie); }
.chip.ok { color: var(--ok); }
.chip.stopp { color: var(--stopp); }
.leer { padding: 28px 20px; text-align: left; display: grid; gap: 6px; }
.leer h3 { font-size: 20px; }

/* Looks */
.looks { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.look { position: relative; display: grid; gap: 8px; align-content: start; border: 0.5px solid var(--linie); border-radius: var(--radius); padding: 10px; background: var(--bergblau); cursor: pointer; min-width: 0; }
.look input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.look:has(input:checked) { outline: 2px solid var(--off); outline-offset: 2px; }
.look:has(input:focus-visible) { outline: 2px solid var(--off); outline-offset: 4px; }
.look img { width: 100%; aspect-ratio: 9 / 16; max-height: 380px; object-fit: contain; background: var(--mitternacht); border-radius: 10px; display: block; }
.look .kein-bild { aspect-ratio: 9 / 16; max-height: 380px; display: grid; place-items: center; background: var(--mitternacht); border-radius: 10px; color: var(--off-muted); font-size: 14px; padding: 12px; text-align: center; }
.look b { font-family: var(--f-titel); font-weight: 600; }
.look span { font-size: 14px; color: var(--off-muted); overflow-wrap: anywhere; }
.keiner { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border: 0.5px solid var(--linie); border-radius: var(--radius); cursor: pointer; }
.keiner:has(input:checked) { outline: 2px solid var(--off); outline-offset: 2px; }
.renders { display: flex; flex-wrap: wrap; gap: 12px; }
.renders figure { margin: 0; display: grid; gap: 6px; width: 180px; max-width: 100%; }
.renders img { width: 100%; aspect-ratio: 9 / 16; object-fit: contain; background: var(--mitternacht); border-radius: 10px; }
.renders figcaption { font-size: 13px; color: var(--off-muted); }

/* Meldungen */
.meldung { border: 0.5px solid var(--linie-stark); border-radius: 12px; padding: 12px 14px; background: var(--bergblau); display: grid; gap: 8px; }
.meldung.fehler { border-color: var(--stopp); }
.meldung.gut { border-color: var(--ok); }
.meldung strong { font-family: var(--f-titel); font-weight: 600; }

/* Liste, Bibliothek, Marke */
.tabelle { display: grid; gap: 0; }
.zeile-idee { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 4px 16px; padding: 14px 20px; border-top: 0.5px solid var(--linie); align-items: start; }
.zeile-idee:first-child { border-top: 0; }
.zeile-idee .id { font-variant-numeric: tabular-nums; color: var(--off-muted); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500; padding-top: 3px; }
.zeile-idee .titel { font-weight: 600; overflow-wrap: anywhere; }
.zeile-idee .satz { grid-column: 2 / -1; color: var(--off-muted); font-size: 14px; overflow-wrap: anywhere; }
.raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.stueck { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; padding: 18px; align-items: start; }
.stueck img { width: 120px; aspect-ratio: 9 / 16; object-fit: contain; background: var(--mitternacht); border-radius: 10px; }
.stueck h3 { font-size: 20px; }
.stueck ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; font-size: 14px; }
.stueck .inhalt { display: grid; gap: 10px; min-width: 0; }
.farben { display: flex; flex-wrap: wrap; gap: 12px; }
.farbe { display: grid; gap: 6px; width: 120px; }
.farbe i { display: block; height: 56px; border-radius: 10px; border: 0.5px solid var(--linie-stark); }
.farbe code { font-size: 13px; color: var(--off-muted); }
dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 18px; }
dt { color: var(--off-muted); font-size: 14px; }
dd { margin: 0; overflow-wrap: anywhere; }
.fuss { font-size: 13px; color: var(--off-muted); }

.fortschritt { height: 4px; border-radius: 999px; background: var(--linie); overflow: hidden; }
.fortschritt > i { display: block; height: 100%; background: var(--off); transition: width 0.2s; }
.entwurf { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bergblau); border: 0.5px solid var(--linie); border-radius: 12px; padding: 14px 16px; max-height: 420px; overflow: auto; }
.wochen-kopf { display: grid; gap: 10px; padding: 16px 20px; }
.wochen-kopf .zeile { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
.warnung { border: 0.5px solid var(--stopp); border-radius: 12px; padding: 10px 14px; color: var(--stopp); font-size: 14px; }
@media (max-width: 560px) {
  .stueck { grid-template-columns: 1fr; }
  .zeile-idee { grid-template-columns: 1fr; }
  .zeile-idee .satz { grid-column: auto; }
  .knopf { padding: 14px 20px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="kopf">

    <div class="werkzeug">

      </div>

  <div id="status" role="status" aria-live="polite"></div>

  <div class="tabs" role="tablist" aria-label="Bereiche">
    <button class="tab" role="tab" id="t-queue" aria-controls="p-queue" aria-selected="true" data-tab="queue">Zu entscheiden <span class="zahl" id="z-queue" data-null="true">0</span></button>
    <button class="tab" role="tab" id="t-inhalte" aria-controls="p-inhalte" aria-selected="false" data-tab="inhalte">Inhalte <span class="zahl" id="z-inhalte" data-null="true">0</span></button>

    <button class="tab" role="tab" id="t-bib" aria-controls="p-bib" aria-selected="false" data-tab="bib">Bibliothek <span class="zahl" id="z-bib" data-null="true">0</span></button>

  <section class="panel" id="p-queue" role="tabpanel" aria-labelledby="t-queue"></section>

  <section class="panel" id="p-marke" role="tabpanel" aria-labelledby="t-marke" hidden></section>

  <p class="fuss" id="fuss"></p>
</div>

<script>
(() => {
  "use strict";
  const DATEN = JSON.parse(document.getElementById("daten").textContent);
  const SERVER = "Notion";
  const SYSTEMNAMEN = /^(claude|system|ki|ai|bot|assistant|assistent|pipeline)$/i;

  /* ---------- kleine Helfer ---------- */
  const $ = (id) => document.getElementById(id);
  function h(tag, attrs, ...kinder) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === false || v === null || v === undefined) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "text") el.textContent = v;
      else el.setAttribute(k, v === true ? "" : String(v));
    }
    for (const k of kinder.flat()) if (k !== null && k !== undefined && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)));
    return el;
  }
  const speicher = {
    lies(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
    schreibe(k, v) { try { localStorage.setItem(k, v); } catch { /* ohne Speicher geht es auch */ } },
  };
  const woerter = (s) => s.trim().split(/\s+/).filter(Boolean).length;

  /* ---------- Zustand ---------- */
  const S = { mcp: null, zeilen: [], inhalte: [], marken: [], inhalteFehler: null, wochen: null, torModus: {}, gate0Frage: {}, seitentext: {}, inhaltFilter: "alle", laden: "idle", fehler: null, tab: "queue", offen: null, name: "", busy: false, entwurf: {}, ablehnen: {}, filter: "alle", stand: null, meldung: null };

  /* ---------- Notion ---------- */
  function ergebnis(r) {
    let p = r && r.payload;
    if (typeof p === "string") { try { p = JSON.parse(p); } catch { /* weiter */ } }
    if (!p || typeof p !== "object") {
      const t = r && Array.isArray(r.content) ? (r.content.find((b) => b.type === "text") || {}).text : null;
      try { p = JSON.parse(t); } catch { p = null; }
    }
    return p;
  }
  async function aufruf(tool, input) {
    return ergebnis(await S.mcp.callTool(SERVER, tool, input, { cache: false }));
  }
  /**
   * Gelesen wird über eine gespeicherte Ansicht (Modus «view»). SQL und der Modus «rows» zählen gegen ein knappes Kontingent des
   * Arbeitsbereichs; die Ansicht nicht. Die Ansicht zeigt alle Eigenschaften und hat keinen Filter.
   */
  const abfrage = (ansicht, cursor) => ({ data: Object.assign({ mode: "view", view_url: ansicht, page_size: 100 }, cursor ? { start_cursor: cursor } : {}) });
  /** Liest eine Ansicht seitenweise bis zu 5 Seiten (500 Zeilen). Gibt Zeilen und die Angabe zurück, ob es mehr gäbe. */
  async function alleZeilen(ansicht) {
    let cursor = null, zeilen = [], mehr = false;
    for (let seite = 0; seite < 5; seite++) {
      const p = await aufruf("notion-query-data-sources", abfrage(ansicht || DATEN.notion.ansicht, cursor));
      if (!p || !Array.isArray(p.results)) throw { code: "form", message: "Die Antwort von Notion hat nicht das erwartete Format." };
      zeilen = zeilen.concat(p.results);
      mehr = !!p.has_more;
      cursor = p.next_cursor || null;
      if (!mehr || !cursor) break;
    }
    return { zeilen, mehr };
  }

  function modell(z) {
    const t = (k) => (typeof z[k] === "string" ? z[k].replace(/<br\s*\/?>/gi, "\n").trim() : "");
    let signale = [];
    try { signale = JSON.parse(z["Signale"] || "[]"); } catch { /* leer */ }
    const treffer = typeof z.url === "string" ? z.url.match(/[0-9a-f]{32}/gi) : null;
    return {
      art: "idee", id: t("Idee-ID"), titel: t("Titel"), status: t("Status"), quelle: t("Quelle"), projekt: t("Projekt"), satz: t("Satz"),
      signale, warum: t("Warum nichts passt"), pitch: t("Pitch"), aufwand: t("Aufwand"),
      entscheid: t("Entscheid"), entscheidGrund: t("Entscheid-Grund"),
      lookRunde: Number(z["Look-Runde"]) || 0, lookWahl: t("Look-Wahl"), lookNotiz: t("Look-Notiz"),
      abnahme: t("Abnahme"), abnahmeNotiz: t("Abnahme-Notiz"), stueck: t("Stueck"),
      bilder: bilder(t("Bilder")), url: typeof z.url === "string" ? z.url : "", seite: treffer ? treffer[treffer.length - 1] : "",
    };
  }
  /** «<id>: <adresse> | <beschriftung>», eine Zeile je Bild. Nur https-Adressen werden als Bild geladen. */
  function bilder(text) {
    return text.split("\n").map((z) => z.trim()).filter(Boolean).map((z) => {
      const m = z.match(/^([A-Za-z0-9_-]+):\s*(\S+)(?:\s*\|\s*(.*))?$/);
      return m ? { id: m[1], ziel: m[2], text: m[3] || "", bild: /^https:\/\//.test(m[2]) } : null;
    }).filter(Boolean);
  }
  function phase(m) {
    if (m.status === "pitch") return !m.entscheid || m.entscheid === "offen" ? "pitch" : "pitch-gesendet";
    if (m.status === "looks") return m.lookWahl ? "look-gesendet" : m.bilder.length >= 3 ? "look" : "look-wartet";
    if (m.status === "render_geprueft") return !m.abnahme || m.abnahme === "offen" ? "abnahme" : "abnahme-gesendet";
    return "sonst";
  }
  const ENTSCHEIDBAR = new Set(["pitch", "look", "abnahme"]);

  const seitenId = (u) => { const t = typeof u === "string" ? u.match(/[0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}/gi) : null; return t ? t[t.length - 1].replace(/-/g, "").toLowerCase() : ""; };
  const liste = (v) => { if (Array.isArray(v)) return v.filter((x) => typeof x === "string"); try { const p = JSON.parse(v || "[]"); return Array.isArray(p) ? p.filter((x) => typeof x === "string") : []; } catch { return []; } };
  const textVon = (z, k) => (typeof z[k] === "string" ? z[k].replace(/<br\s*\/?>/gi, "\n").replace(/<mention-[a-z-]+ url="([^"]*)"[^>]*>([^<]*)<\/mention-[a-z-]+>/gi, (_m, u, n) => n.trim() || u).trim() : "");
  const hatMensch = (von) => !!von && !!von.trim() && !SYSTEMNAMEN.test(von.trim());

  /** Eine Zeile der Ansicht «Inhalte». Die Namen der Spalten stehen in der Datenbank genau so. */
  function modellInhalt(z) {
    const t = (k) => textVon(z, k);
    const tor = (p) => ({ entscheid: t(p + " Entscheid"), grund: t(p + " Grund"), von: t(p + " von"), am: t("date:" + p + " am:start") });
    const url = typeof z.url === "string" ? z.url : "";
    return {
      art: "inhalt", id: t("Inhalt-ID"), titel: t("Titel"), format: t("Format"), plattformen: liste(z["Plattformen"]), markeUrls: liste(z["Marke"]),
      quelle: t("Quelle"), referenz: t("Referenz"), hook: t("Hook"), winkel: t("Winkel"), beleg: t("Beleg"), aufwand: t("Aufwand"), status: t("Status"),
      torI: tor("Tor I"), torP: tor("Tor P"), dateien: t("Dateien"), ziel: t("Ziel"),
      offeneMarkierungen: typeof z["Offene Markierungen"] === "number" ? z["Offene Markierungen"] : 0, url, seite: seitenId(url),
    };
  }
  /** Eine Zeile der Ansicht «Marken». */
  function modellMarke(z) {
    const t = (k) => textVon(z, k);
    const url = typeof z.url === "string" ? z.url : "";
    return { art: "marke", id: t("Marken-ID"), titel: t("Name"), typ: t("Typ"), gate0: t("Gate 0") || "offen", gate0Von: t("Gate 0 von"), gate0Am: t("date:Gate 0 am:start"), notizen: t("Notizen"), url, seite: seitenId(url) };
  }
  /** Gate 0 gilt nur mit einem Menschen mit Namen (wie im Code von Claude). */
  const gate0Wirksam = (mk) => (mk && mk.gate0 === "freigegeben" && hatMensch(mk.gate0Von) ? "freigegeben" : mk ? mk.gate0 === "freigegeben" ? "offen" : mk.gate0 : "offen");
  const markeVon = (c) => S.marken.find((mk) => c.markeUrls.some((u) => seitenId(u) === mk.seite)) || null;

  const torOffen = (t) => !t.entscheid || t.entscheid === "offen";
  function phaseInhalt(c) {
    if (c.status === "Pitch bereit") return torOffen(c.torI) ? "tor-i" : "tor-i-gesendet";
    if (c.status === "Entwurf fertig") return torOffen(c.torP) ? "tor-p" : "tor-p-gesendet";
    return "sonst";
  }
  const ENTSCHEIDBAR_INHALT = new Set(["tor-i", "tor-p"]);

  async function laden(still) {
    S.laden = "laden";
    if (!still) zeichne();
    try {
      const r = await alleZeilen(DATEN.notion.ansicht);

    const grundOk = () => text().length >= 10 && woerter(text()) >= 2;
    const frageOk = () => text().length >= 5;
    const nochOffen = (f) => f.status === "Pitch bereit" && torOffen(f.torI);
    const sende = (e, grund) => senden(c, Object.assign({ "Tor I Entscheid": e, "Tor I Grund": grund || null, "Tor I von": S.name.trim() }, datum("Tor I am")), nochOffen, (d) => d.torI.entscheid === e);
    const waehle = (m) => { setzeEntwurf(c, "text", ""); S.torModus[c.id] = m; zeichne(); };
    const link = /^https?:\/\//.test(c.referenz) ? h("a", { href: c.referenz, target: "_blank", rel: "noopener", text: "Quelle öffnen" }) : null;
    return [
      g0 !== "freigegeben" ? h("p", { class: "warnung", text: mk ? "Gate 0 der Marke «" + mk.titel + "» ist noch nicht freigegeben. Dein Entscheid wird gespeichert, wirkt aber erst, wenn Gate 0 freigegeben ist." : "Diesem Inhalt ist keine Marke zugeordnet. Ohne Marke geht er nicht in Produktion." }) : null,
      abschnitt("Der erste Satz", h("p", { class: "zitat", text: "«" + c.hook + "»" })),
      abschnitt("Was ist neu oder anders", h("p", { class: "text", text: c.winkel })),
      abschnitt("Beleg", h("p", { class: "text", text: c.beleg }), link),
      abschnitt("Eckdaten", zeilenListe([["Format", c.format], ["Plattformen", c.plattformen.join(", ")], ["Marke", mk ? mk.titel : ""], ["Quelle", c.quelle], ["Aufwand", c.aufwand]])),
      modus === "ablehnen" ? textfeld(c, "text", "Grund der Ablehnung", "Mindestens zwei Wörter. Der Grund verhindert, dass dieselbe Idee wiederkommt.") : null,
      modus === "rueckfrage" ? textfeld(c, "text", "Deine Frage an Claude", "Claude beantwortet sie und legt die Idee neu vor.") : null,
      h("p", { class: "hinweis" }, "Nach einer Freigabe entsteht der Inhalt. Zuerst prüft Claude Beleg und Dubletten. ", notionLink(c)),
      h("div", { class: "aktionen" },
        modus === "ablehnen" ? [knopf(c, "Ablehnung senden", "gold", grundOk, () => sende("abgelehnt", text())), knopf(c, "Zurück", "", () => true, () => waehle(false))]
        : modus === "rueckfrage" ? [knopf(c, "Frage senden", "gold", frageOk, () => sende("Rückfrage", text())), knopf(c, "Zurück", "", () => true, () => waehle(false))]
        : [knopf(c, "Freigeben", "gold", () => true, () => sende("freigegeben", "")), knopf(c, "Mit Frage zurück", "", () => true, () => waehle("rueckfrage")), knopf(c, "Ablehnen", "", () => true, () => waehle("ablehnen"))]),
    ];
  }

  /** Der Text eines Entwurfs steht im Inhalt der Notion-Seite. Er wird beim Öffnen der Karte geladen. */
  function seitentext(c) {
    const vorhanden = S.seitentext[c.id];
    if (vorhanden) return vorhanden;
    S.seitentext[c.id] = { status: "laden" };
    (async () => {
      try {
        const pg = await aufruf("notion-fetch", { id: c.seite });
        const roh = pg && typeof pg.text === "string" ? pg.text : "";
        const m = roh.match(/<content>([\s\S]*?)<\/content>/);
        S.seitentext[c.id] = { status: "fertig", text: (m ? m[1] : "").trim() };
      } catch (e) {
        S.seitentext[c.id] = { status: "fehler", meldung: fehlertext(e, false)[1] };
      }
      zeichne();
    })();
    return S.seitentext[c.id];
  }

  function torPInhalt(c, mk, g0) {
    const modus = S.torModus[c.id] || false; // false oder "aenderung"
    const text = () => entwurfFeld(c, "text", "").trim();
    const nochOffen = (f) => f.status === "Entwurf fertig" && torOffen(f.torP);
    const sende = (e, grund) => senden(c, Object.assign({ "Tor P Entscheid": e, "Tor P Grund": grund || null, "Tor P von": S.name.trim() }, datum("Tor P am")), nochOffen, (d) => d.torP.entscheid === e);
    const waehle = (m) => { setzeEntwurf(c, "text", ""); S.torModus[c.id] = m; zeichne(); };
    const st = seitentext(c);
    const entwurf = st.status === "fertig"
      ? (st.text ? h("div", { class: "entwurf", text: st.text }) : h("p", { class: "hinweis", text: "Die Notion-Seite hat noch keinen Text. Bei Reels und Carousels liegt der Entwurf als Datei vor (siehe unten)." }))
      : st.status === "fehler" ? h("p", { class: "warnung", text: "Der Entwurf liess sich nicht laden: " + st.meldung })
      : h("p", { class: "hinweis", text: "Lade den Entwurf aus Notion …" });
    return [
      g0 !== "freigegeben" ? h("p", { class: "warnung", text: mk ? "Gate 0 der Marke «" + mk.titel + "» ist noch nicht freigegeben. Deine Freigabe wirkt erst danach." : "Diesem Inhalt ist keine Marke zugeordnet." }) : null,
      c.offeneMarkierungen > 0 ? h("p", { class: "warnung", text: c.offeneMarkierungen + " offene Markierung(en) der Schwere «muss». Deine Freigabe wirkt erst, wenn sie erledigt sind." }) : null,
      abschnitt("Der Entwurf", entwurf),
      c.dateien ? abschnitt("Dateien", h("p", { class: "text", text: c.dateien })) : null,
      c.ziel ? abschnitt("Ziel", h("p", { class: "text", text: c.ziel })) : null,
      abschnitt("Beleg: Jede Zahl im Text muss hier stehen", h("p", { class: "text", text: c.beleg })),
      modus === "aenderung" ? textfeld(c, "text", "Was soll anders sein", "Konkret, zum Beispiel: Schluss kürzer, Zahl im zweiten Satz streichen.") : null,
      h("p", { class: "hinweis" }, "Mit der Freigabe darf der Inhalt geplant werden. ", notionLink(c)),
      h("div", { class: "aktionen" },
        modus === "aenderung" ? [knopf(c, "Änderung senden", "gold", () => text().length >= 5, () => sende("Änderung", text())), knopf(c, "Zurück", "", () => true, () => waehle(false))]
        : [knopf(c, "Freigeben", "gold", () => true, () => sende("freigegeben", "")), knopf(c, "Änderung nötig", "", () => true, () => waehle("aenderung"))]),
    ];
  }

  /* ---------- Wochenmodus: alle neuen Ideen nacheinander ---------- */
  function wochenListe() {
    const w = S.wochen;
    return w.ids.filter((id) => !w.uebersprungen.includes(id)).map((id) => S.inhalte.find((c) => c.id === id)).filter((c) => c && phaseInhalt(c) === "tor-i");
  }
  function zeichneWochen(p) {
    const w = S.wochen, rest = wochenListe(), gesamt = w.ids.length, erledigt = gesamt - rest.length;
    p.append(h("div", { class: "karte wochen-kopf", id: "wochen" },
      h("div", { class: "zeile" }, h("span", { class: "eyebrow", text: "Wochenmodus" }), h("button", { class: "knopf klein", type: "button", id: "wochen-ende", onclick: () => { S.wochen = null; zeichne(); } }, "Beenden")),
      h("p", { id: "wochen-stand", text: rest.length ? "Idee " + (erledigt + 1) + " von " + gesamt : "Alle " + gesamt + " Ideen durchgesehen" }),
      h("div", { class: "fortschritt", role: "progressbar", "aria-label": "Fortschritt", "aria-valuemin": "0", "aria-valuemax": String(gesamt), "aria-valuenow": String(erledigt) }, h("i", { style: "width:" + Math.round((erledigt / gesamt) * 100) + "%" }))));
    if (!rest.length) {
      const ue = w.uebersprungen.length;
      return p.append(leer("Fertig", ue ? ue + " übersprungen. Sie bleiben unter «Zu entscheiden», sobald du den Wochenmodus beendest." : "Alle Entscheide stehen in Notion."));
    }
    const c = rest[0];
    p.append(inhaltKarte(c, true));
    p.append(h("div", { class: "aktionen" }, h("button", { class: "knopf klein", type: "button", id: "wochen-weiter", disabled: S.busy, onclick: () => { w.uebersprungen.push(c.id); zeichne(); } }, "Überspringen")));
  }

  function zeileInhalt(c) {
    const ph = phaseInhalt(c);
    const art = c.status === "Verworfen" ? "stopp" : ["Freigegeben", "Geplant", "Veröffentlicht", "Ausgewertet"].includes(c.status) ? "ok" : ENTSCHEIDBAR_INHALT.has(ph) ? "" : "still";
    const mk = markeVon(c);
    return h("div", { class: "zeile-idee" },
      h("span", { class: "id", text: c.id }),
      h("span", { class: "titel" }, c.url ? h("a", { href: c.url, target: "_blank", rel: "noopener", text: c.titel }) : c.titel),
      chip(ph.endsWith("-gesendet") ? "Wartet auf Claude" : c.status || "Neu", art),
      h("span", { class: "satz", text: [c.format, mk && mk.titel, c.hook && "«" + c.hook + "»"].filter(Boolean).join(" · ") }));
  }

  function zeichneInhalte() {
    const p = $("p-inhalte");
    p.replaceChildren();
    if (!S.mcp) return p.append(leer("Inhalte", "Sobald der Prüfplatz mit Notion verbunden ist, siehst du hier jeden Inhalt mit seinem Stand."));
    const sel = h("select", { id: "filter-inhalte", "aria-label": "Nach Stand filtern", onchange: (ev) => { S.inhaltFilter = ev.target.value; zeichne(); } },
      h("option", { value: "alle", text: "Alle Stände" }), ...STATI_INHALT.map((k) => h("option", { value: k, text: k })));
    sel.value = S.inhaltFilter;
    p.append(h("div", { class: "feld", style: "max-width: 260px" }, h("label", { for: "filter-inhalte", text: "Stand" }), sel));
    const liste = S.inhalte.filter((c) => S.inhaltFilter === "alle" || (c.status || "Neu") === S.inhaltFilter);
    p.append(liste.length ? h("div", { class: "karte tabelle" }, liste.map(zeileInhalt)) : leer(S.inhalte.length ? "Keine Inhalte in diesem Stand" : "Noch keine Inhalte", S.inhalte.length ? "Wähle oben einen anderen Stand." : "Ideen für Reels, Carousels, Posts und Blogtexte erscheinen hier, sobald Claude sie in Notion anlegt."));
  }

  function zeileIdee(m) {
    const ph = phase(m);
    const art = m.status === "abgelehnt" ? "stopp" : m.status === "in_bibliothek" ? "ok" : ENTSCHEIDBAR.has(ph) ? "" : "still";
    return h("div", { class: "zeile-idee" },
      h("span", { class: "id", text: m.id }),
      h("span", { class: "titel" }, m.url ? h("a", { href: m.url, target: "_blank", rel: "noopener", text: m.titel }) : m.titel),
      chip(ph.endsWith("-gesendet") ? "Wartet auf Claude" : (STATUSTEXT[m.status] || m.status), art),
      h("span", { class: "satz", text: "«" + m.satz + "»" }));
  }

  function zeichneAlle() {
    const p = $("p-alle");
    p.replaceChildren();
    if (!S.mcp) return p.append(leer("Alle Ideen", "Sobald der Prüfplatz mit Notion verbunden ist, siehst du hier jede Idee mit ihrem Stand."));
    const sel = h("select", { id: "filter", "aria-label": "Nach Stand filtern", onchange: (ev) => { S.filter = ev.target.value; zeichne(); } },
      h("option", { value: "alle", text: "Alle Stände" }), ...Object.entries(STATUSTEXT).map(([k, v]) => h("option", { value: k, text: v })));
    sel.value = S.filter;
    p.append(h("div", { class: "feld", style: "max-width: 260px" }, h("label", { for: "filter", text: "Stand" }), sel));
    const liste = S.zeilen.filter((m) => S.filter === "alle" || m.status === S.filter);
    p.append(liste.length ? h("div", { class: "karte tabelle" }, liste.map(zeileIdee)) : leer("Keine Ideen in diesem Stand", "Wähle oben einen anderen Stand."));
  }

  function zeichneBib() {
    const p = $("p-bib");
    p.replaceChildren();
    const aktiv = DATEN.bibliothek.filter((s) => s.status === "aktiv");
    const rest = DATEN.bibliothek.filter((s) => s.status !== "aktiv");
    p.append(h("p", { class: "muted", text: aktiv.length + (aktiv.length === 1 ? " aktives Stück" : " aktive Stücke") + ". Nur aktive Stücke darf das Storyboard benutzen." }));
    p.append(h("div", { class: "raster" }, [...aktiv, ...rest].map(stueckKarte)));
    if (DATEN.bibliothek.length === 0) p.append(leer("Noch keine Stücke", "Die Bibliothek wächst aus den Ideen, die du freigibst."));
  }
  function stueckKarte(s) {
    const liste = (titel, arr) => (arr && arr.length ? h("div", { class: "abschnitt" }, h("span", { class: "eyebrow", text: titel }), h("ul", null, arr.map((x) => h("li", { text: x })))) : null);
    return h("article", { class: "karte stueck" },
      s.vorschau ? h("img", { src: s.vorschau, alt: "Standbild von " + s.name, loading: "lazy" }) : h("div"),
      h("div", { class: "inhalt" },
        h("div", { class: "zeile", style: "display:flex;flex-wrap:wrap;gap:8px;align-items:center" }, h("span", { class: "eyebrow", text: "Version " + s.version }), chip(STUECKSTATUS[s.status] || s.status, s.status === "aktiv" ? "ok" : "still")),
        h("h3", { text: s.name }),
        h("p", { text: s.zweck }),
        h("p", { class: "hinweis", text: "Auslöser: " + s.ausloeser + " Dauer " + s.dauer.standard.toString().replace(".", ",") + " s (" + s.dauer.min.toString().replace(".", ",") + " bis " + s.dauer.max.toString().replace(".", ",") + ")." }),
        liste("Passt, wenn", s.wann), liste("Passt nicht, wenn", s.wannNicht),
        liste("Pro Einsatz anders", s.parameter.map((x) => x.label + (x.pflicht ? " (Pflicht)" : ""))),
        liste("Beispielsätze", s.beispiele)));
  }

  /** Eine Marke aus Notion mit ihrem Gate 0. Die Freigabe gibt ein Mensch mit Namen, hier. */
  function markenKarte(mk) {
    const frei = gate0Wirksam(mk) === "freigegeben";
    const profil = DATEN.marke && DATEN.marke.schluessel === mk.id ? DATEN.marke : null;
    const luecken = profil ? profil.gate0Luecken || [] : [];
    const frage = !!S.gate0Frage[mk.id];
    const nochOffen = (f) => f.gate0 !== "freigegeben";
    const sende = () => senden(mk, Object.assign({ "Gate 0": "freigegeben", "Gate 0 von": S.name.trim() }, datum("Gate 0 am")), nochOffen, (d) => d.gate0 === "freigegeben" && d.gate0Von === S.name.trim());
    return h("article", { class: "karte", style: "padding:20px;display:grid;gap:14px" },
      h("div", { style: "display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center" }, h("h3", { text: mk.titel }), chip(mk.typ || "Marke", "still"), chip(frei ? "Gate 0 freigegeben" : "Gate 0 offen", frei ? "ok" : "stopp")),
      mk.notizen ? h("p", { class: "text", text: mk.notizen }) : null,
      frei
        ? h("p", { class: "hinweis", text: "Freigegeben von " + mk.gate0Von + (mk.gate0Am ? " am " + new Date(mk.gate0Am).toLocaleDateString("de-CH") : "") + "." })
        : [
          luecken.length ? h("p", { class: "warnung", text: "Das Markenprofil nennt noch: " + luecken.join(", ") + "." }) : null,
          mk.gate0 === "freigegeben" ? h("p", { class: "warnung", text: "In Notion steht «freigegeben», aber ohne den Namen eines Menschen. So gilt es nicht." }) : null,
          frage ? h("p", { id: "gate0-frage", text: "Du gibst «" + mk.titel + "» frei als " + (S.name.trim() || "…") + ". Ab dann gelten Tor I und Tor P für diese Marke." }) : null,
          h("div", { class: "aktionen" }, frage
            ? [knopf(mk, "Ja, Gate 0 freigeben", "gold", () => true, sende), knopf(mk, "Abbrechen", "", () => true, () => { S.gate0Frage[mk.id] = false; zeichne(); })]
            : knopf(mk, "Gate 0 freigeben", "gold", () => true, () => { S.gate0Frage[mk.id] = true; zeichne(); })),
        ]);
  }

  function zeichneMarke() {
    const p = $("p-marke");
    p.replaceChildren();
    if (S.mcp && S.marken.length) {
      p.append(h("p", { class: "eyebrow", text: "Marken und Gate 0" }));
      for (const mk of S.marken) p.append(markenKarte(mk));
      p.append(h("p", { class: "eyebrow", text: "Profil im Repo" }));
    }
    const m = DATEN.marke;
    if (!m) return p.append(leer("Kein Markenprofil", "Es liegt kein Markenprofil im Repo."));
    const frei = m.status === "freigegeben";
    p.append(h("div", { class: "karte", style: "padding:20px;display:grid;gap:18px" },
      h("div", { style: "display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center" }, h("h3", { text: m.name }), chip(frei ? "Freigegeben" : "Platzhalter", frei ? "ok" : "stopp")),
      frei ? null : h("p", { text: "Dieses Profil im Repo steht noch auf «Platzhalter». Bis Gate 0 übernommen ist, entstehen nur Entwürfe, nie ein finales Video." }),
      h("div", { class: "farben" }, Object.entries(m.farben).map(([k, v]) => h("div", { class: "farbe" }, h("i", { style: "background:" + v }), h("b", { text: k }), h("code", { text: v })))),
      h("dl", null,
        h("dt", { text: "Titelschrift" }), h("dd", { text: m.schriften.titel }),
        h("dt", { text: "Fliesstext" }), h("dd", { text: m.schriften.fliesstext }),
        h("dt", { text: "Look" }), h("dd", { text: m.look || "" }),
        h("dt", { text: "Anrede" }), h("dd", { text: m.tonalitaet.anrede }),
        h("dt", { text: "Verbotene Wörter" }), h("dd", { text: (m.tonalitaet.verboteneWoerter || []).join(", ") }),
        h("dt", { text: "Hinweise" }), h("dd", { text: m.tonalitaet.hinweise || "" })),
      h("p", { class: "hinweis", text: "Gate 0 gibst du oben frei. Das Profil im Repo ändert nur Claude Code, und es übernimmt dort die Freigabe erst nach deinem Eintrag in Notion." })));
  }

  /* ---------- Start ---------- */
  document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => { S.tab = b.dataset.tab; zeichne(); }));
  $("neu-laden").addEventListener("click", () => { S.meldung = null; S.seitentext = {}; laden(); });
  $("name").addEventListener("input", (ev) => { S.name = ev.target.value; speicher.schreibe("pp-name", S.name); document.querySelectorAll("[data-braucht]").forEach((b) => (b.disabled = S.busy || !b._ok())); });
  document.addEventListener("visibilitychange", () => {
    const tippt = document.activeElement && /^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement.tagName);
    if (!document.hidden && S.mcp && !S.busy && !tippt && S.laden !== "laden") laden(true);
  });

  S.name = speicher.lies("pp-name");
  zeichne();

  (async () => {
    const claude = window.claude;
    if (!claude || typeof claude.use !== "function") return zeichne();
    const [mcp, user] = await Promise.all([claude.use("mcp").catch(() => null), claude.use("user").catch(() => null)]);
    S.mcp = mcp;
    if (user) {
      try {
        const me = await user.me();
        if (me && me.name && !S.name) { S.name = me.name; speicher.schreibe("pp-name", S.name); }
      } catch { /* Name bleibt leer, der Mensch trägt ihn ein */ }
    }
    zeichne();
    if (S.mcp) laden();
  })();
})();
</script>
